AWSTemplateFormatVersion: '2010-09-09'
Description: Homenub public catalog and checkout HTTP API; no private lookup routes.
Parameters:
  ProjectName:
    Type: String
    Default: visitor-app
  Environment:
    Type: String
    Default: dev
  VisitorLambdaArn:
    Type: String
  SiteOrigin:
    Type: String
    Default: https://www.homenub.com
    AllowedValues: ['https://www.homenub.com']
  LogRetentionDays:
    Type: Number
    AllowedValues: [1,3,5,7,14,30,60,90,120,150,180,365,400,545,731,1096,1827,2192,2557,2922,3288,3653]
  RequestsPerSecond:
    Type: Number
    MinValue: 1
  BurstRequests:
    Type: Number
    MinValue: 1
Resources:
  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/vendedlogs/apis/${ProjectName}-${Environment}-access-logs'
      RetentionInDays: !Ref LogRetentionDays
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-api'
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: [!Ref SiteOrigin]
        AllowMethods: [GET,POST,OPTIONS]
        AllowHeaders: [Content-Type]
        ExposeHeaders: [X-Homenub-Contract-Version,Retry-After]
  LambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      PayloadFormatVersion: '2.0'
      IntegrationUri: !Ref VisitorLambdaArn
      TimeoutInMillis: 12000
  PostRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /checkouts
      Target: !Sub 'integrations/${LambdaIntegration}'
  GetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /books
      Target: !Sub 'integrations/${LambdaIntegration}'
  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: !Ref BurstRequests
        ThrottlingRateLimit: !Ref RequestsPerSecond
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","routeKey":"$context.routeKey","status":"$context.status","responseLength":"$context.responseLength"}'
  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref VisitorLambdaArn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*'
Outputs:
  StackName:
    Value: !Ref AWS::StackName
  ApiId:
    Value: !Ref HttpApi
  ApiBaseUrl:
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  ApiStageName:
    Value: '$default'
  AccessLogGroupName:
    Value: !Ref ApiAccessLogGroup
