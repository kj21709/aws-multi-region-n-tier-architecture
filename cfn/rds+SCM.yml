AWSTemplateFormatVersion: "2010-09-09"
Description: MySQL RDS (private) + Secrets Manager (primary only) + optional cross-region read replica (secondary)

Parameters:
  DBName:
    Type: String
    Default: rdslabdb

  DBUser:
    Type: String
    Default: dbadmin

  DBInstanceClass:
    Type: String
    Default: db.t3.micro

  AllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20

  EngineVersion:
    Type: String
    Default: "8.0"
    AllowedValues: ['8.0']

  DatabaseKmsKeyArn:
    Type: String
    Description: Regional KMS key authorized for encrypted database and cross-region replication.
    AllowedPattern: 'arn:aws:kms:us-east-[12]:[0-9]{12}:key/[0-9a-f-]{36}'

  ProjectName:
    Type: String
    Default: visitor-app

  Environment:
    Type: String
    Default: dev

  DRMode:
    Type: String
    Default: primary
    AllowedValues: [primary, secondary]

  # Used only when DRMode=secondary (cross-region read replica source ARN)
  PrimaryDbArn:
    Type: String
    Default: ""

  # Stable secret name across regions (replicated from primary via Secrets Manager)
  SecretName:
    Type: String
    Default: visitor-app-dev-mysql-credentials

  # Region for Secrets Manager replication (only used in primary)
  ReplicaRegion:
    Type: String
    Default: us-east-2
    AllowedValues: [us-east-2]

Rules:
  RegionalIdentity:
    Assertions:
      - Assert: !Equals [!Select [3, !Split [':', !Ref DatabaseKmsKeyArn]], !Ref 'AWS::Region']
        AssertDescription: The database KMS key must belong to this region.
  VirginiaPrimary:
    RuleCondition: !Equals [!Ref DRMode, primary]
    Assertions:
      - Assert: !Equals [!Ref 'AWS::Region', us-east-1]
        AssertDescription: Primary is deployed only in Virginia.
  OhioReplica:
    RuleCondition: !Equals [!Ref DRMode, secondary]
    Assertions:
      - Assert: !Equals [!Ref 'AWS::Region', us-east-2]
        AssertDescription: Standby is deployed only in Ohio.
Conditions:
  IsPrimary: !Equals [!Ref DRMode, primary]
  HasPrimaryDbArn: !Not [!Equals [!Ref PrimaryDbArn, ""]]

  # Create a cross-region read replica only in SECONDARY and only if PrimaryDbArn is provided
  CreateReplica: !And
    - !Equals [!Ref DRMode, secondary]
    - !Condition HasPrimaryDbArn

  # We only export endpoint/port when a DB (primary or replica) exists
  HasDbEndpoint: !Or [!Condition IsPrimary, !Condition CreateReplica]

Resources:
  MySQLParameters:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: Homenub TLS and GTID prerequisites; verify actual applied values before recovery.
      Family: mysql8.0
      Parameters:
        require_secure_transport: 'ON'
        gtid-mode: 'ON'
        enforce_gtid_consistency: 'ON'
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet group for MySQL RDS
      SubnetIds:
        - !ImportValue PrivateSubnet1Id
        - !ImportValue PrivateSubnet2Id

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for app Lambdas
      VpcId: !ImportValue VpcId

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow MySQL access from Lambda SG
      VpcId: !ImportValue VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref LambdaSecurityGroup

  # PRIMARY creates the secret and replicates it to ReplicaRegion
  DBSecret:
    Type: AWS::SecretsManager::Secret
    Condition: IsPrimary
    Properties:
      Name: !Ref SecretName
      Description: "Master credentials for MySQL RDS"
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username":"${DBUser}"}'
        GenerateStringKey: "password"
        PasswordLength: 24
        ExcludeCharacters: '"@/\\'
      ReplicaRegions:
        - Region: !Ref ReplicaRegion
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-mysql-credentials"

  # PRIMARY DB
  MySQLPrimary:
    Type: AWS::RDS::DBInstance
    Condition: IsPrimary
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub "${ProjectName}-${Environment}-mysql-primary"
      Engine: mysql
      EngineVersion: !Ref EngineVersion
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: !Ref AllocatedStorage
      StorageType: gp2
      StorageEncrypted: true
      KmsKeyId: !Ref DatabaseKmsKeyArn
      DBParameterGroupName: !Ref MySQLParameters
      DBName: !Ref DBName

      # Needed for replica eligibility
      BackupRetentionPeriod: 7

      MasterUsername: !Sub "{{resolve:secretsmanager:${SecretName}:SecretString:username}}"
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${SecretName}:SecretString:password}}"

      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref RDSSecurityGroup

      MultiAZ: true
      PubliclyAccessible: false

  # SECONDARY cross-region read replica
  MySQLReadReplica:
    Type: AWS::RDS::DBInstance
    Condition: CreateReplica
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub "${ProjectName}-${Environment}-mysql-replica-${AWS::Region}"

      # Cross-region replica: Source is ARN and you must specify SourceRegion
      SourceDBInstanceIdentifier: !Ref PrimaryDbArn
      SourceRegion: !Select [3, !Split [":", !Ref PrimaryDbArn]]

      DBInstanceClass: !Ref DBInstanceClass
      StorageType: gp2
      KmsKeyId: !Ref DatabaseKmsKeyArn
      DBParameterGroupName: !Ref MySQLParameters
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref RDSSecurityGroup

      PubliclyAccessible: false
      MultiAZ: false

Outputs:
  StackName:
    Value: !Ref AWS::StackName

  DBSecretName:
    Value: !Ref SecretName
    Export:
      Name: !Sub "${AWS::StackName}-DBSecretName"

  LambdaSecurityGroupId:
    Value: !Ref LambdaSecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-LambdaSecurityGroupId"

  # Export endpoint/port only when DB exists (primary or replica)
  RDSEndpoint:
    Condition: HasDbEndpoint
    Value: !If
      - IsPrimary
      - !GetAtt MySQLPrimary.Endpoint.Address
      - !GetAtt MySQLReadReplica.Endpoint.Address
    Export:
      Name: !Sub "${AWS::StackName}-RDSEndpoint"

  RDSPort:
    Condition: HasDbEndpoint
    Value: !If
      - IsPrimary
      - !GetAtt MySQLPrimary.Endpoint.Port
      - !GetAtt MySQLReadReplica.Endpoint.Port
    Export:
      Name: !Sub "${AWS::StackName}-RDSPort"

  DBName:
    Value: !Ref DBName
    Export:
      Name: !Sub "${AWS::StackName}-DBName"

  PrimaryDbArn:
    Condition: IsPrimary
    Value: !GetAtt MySQLPrimary.DBInstanceArn
    Export:
      Name: !Sub "${AWS::StackName}-PrimaryDbArn"
