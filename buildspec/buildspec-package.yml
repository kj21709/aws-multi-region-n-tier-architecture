{
  "version": "0.2",
  "env": {
    "variables": {
      "PRIMARY_REGION": "us-east-1",
      "SECONDARY_REGION": "us-east-2"
    }
  },
  "phases": {
    "install": {
      "runtime-versions": {
        "python": "3.12"
      }
    },
    "build": {
      "commands": [
        "test -n \"$RELEASE_INPUTS_FILE\"",
        "test -n \"$RELEASE_CREATED_AT\"",
        "test -n \"$LAMBDA_WHEEL_DIRECTORY\"",
        "python3 -m homenub_release.cli --inputs \"$RELEASE_INPUTS_FILE\" --created-at \"$RELEASE_CREATED_AT\" --wheels \"$LAMBDA_WHEEL_DIRECTORY\" --output release-artifacts",
        "python3 -m checks.release --report release-artifacts/verification/release.json"
      ]
    }
  },
  "artifacts": {
    "base-directory": "release-artifacts",
    "files": [
      "**/*"
    ]
  }
}
