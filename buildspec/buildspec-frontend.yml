{
  "version": "0.2",
  "phases": {
    "install": {
      "runtime-versions": {
        "python": "3.12"
      }
    },
    "build": {
      "commands": [
        "test -f release-artifacts/App/config.js",
        "test -f release-artifacts/release-manifest.json",
        "python3 -m checks.release --report release-artifacts/verification/frontend-package.json"
      ]
    }
  },
  "artifacts": {
    "base-directory": "release-artifacts",
    "files": [
      "App/**/*",
      "release-manifest.json",
      "verification/frontend-package.json"
    ]
  }
}
