{
  "version": "0.2",
  "env": {
    "variables": {
      "PRIMARY_REGION": "us-east-1",
      "SECONDARY_REGION": "us-east-2",
      "PRIMARY_STACK_NAME": "visitor-app-dev-primary",
      "SECONDARY_STACK_NAME": "visitor-app-dev-secondary"
    }
  },
  "phases": {
    "install": {
      "runtime-versions": {
        "python": "3.12"
      }
    },
    "build": {
      "commands": [
        "python3 -m checks.release --report verification/release.json",
        "python3 -m checks.library --report verification/library.json",
        "python3 -m checks.schema --report verification/schema.json",
        "python3 -m checks.recovery --report verification/recovery.json",
        "python3 -m checks.restore --report verification/restore.json"
      ]
    }
  },
  "artifacts": {
    "files": [
      "verification/*.json",
      "release-artifacts/**/*"
    ]
  }
}
